# ==========================================================
#  Miniony - konfiguracja
#  Wszystkie teksty używają formatu MiniMessage:
#  https://docs.advntr.dev/minimessage/format.html
# ==========================================================

# Wersja pliku konfiguracyjnego - nie zmieniaj ręcznie.
wersja-configu: 2

baza-danych:
  # Nazwa pliku bazy SQLite w folderze pluginu.
  plik: 'miniony.db'
  # Co ile sekund zapisywać zmienione miniony (praca, zmiana magazynu przez pracę).
  # Akcje graczy (stawianie, zbieranie, odbieranie itemów) zapisywane są natychmiast.
  autozapis-sekundy: 30

praca:
  # Co ile ticków (20 ticków = 1 sekunda) scheduler sprawdza, które miniony mają wykonać cykl pracy.
  # Każdy minion pracuje według własnego interwału z sekcji "typy".
  takt-tickow: 20

wyspy:
  # Gdy SuperiorSkyblock2 jest zainstalowany: miniona można postawić tylko na wyspie,
  # której gracz jest członkiem. Gdy SSB2 nie ma na serwerze, to ustawienie jest ignorowane.
  wymagaj-wyspy: true
  # Czy członkowie wyspy (nie tylko właściciel miniona) mogą otwierać GUI i odbierać itemy.
  dostep-czlonkow: true
  # Czy zmiany bloków wykonywane przez miniony mają być zgłaszane do SSB2 (liczniki bloków / wartość wyspy).
  aktualizuj-bloki-wyspy: true

limity:
  # Domyślny limit postawionych minionów na gracza (gdy nie ma permisji miniony.limit.<liczba>).
  domyslny: 3
  # Twardy sufit - żadna permisja miniony.limit.<liczba> nie da więcej niż ta wartość.
  maksimum: 50
  # Czy permisja miniony.limit.bypass ignoruje także twardy sufit.
  bypass-ignoruje-maksimum: true

ulepszanie:
  # true = ulepszać może tylko właściciel miniona (i administrator), false = każdy z dostępem do GUI.
  tylko-wlasciciel: true

zbieranie:
  # Przy zbieraniu miniona przenieś zawartość jego magazynu do ekwipunku gracza.
  # To, co się nie zmieści, zostaje w magazynie miniona (zapisane razem z nim) - nic nie wypada na ziemię.
  oddaj-magazyn: true

hologram:
  wlaczony: true
  # Wysokość hologramu nad podstawą miniona (w blokach).
  wysokosc: 1.35
  # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <wlasciciel>, <zapelnienie>, <pojemnosc>, <status>
  linie:
    - '<gold><typ> <gray>[<white>Poz. <poziom></white>]'
    - '<gray>Właściciel: <white><wlasciciel>'
    - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc></white>'
    - '<status>'
  status:
    pracuje: '<green>Pracuje'
    pelny: '<red>Magazyn pełny'
    brak-miejsca: '<yellow>Brak miejsca do pracy'
    oczekuje: '<gray>Oczekuje'
    brak-celu: '<yellow>Brak celu pracy'

# Nazwy rzadkości (w Etapie 3 rozbudowane o mnożniki).
rzadkosci:
  ZWYKLY:
    nazwa: '<gray>Zwykły'

# Typy minionów. Klucz sekcji to identyfikator typu używany w komendach (/minion give <gracz> <typ>).
# Każdy typ ma poziomy 1..N (sekcja "poziomy"). Wartości, których nie podasz w danym poziomie,
# są dziedziczone z poprzedniego poziomu. "koszt" to koszt ulepszenia NA dany poziom:
#   pieniadze: kwota pobierana przez Vault (0 = brak)
#   przedmioty: lista 'MATERIAL:ilość' albo 'nexo:id_przedmiotu:ilość' (przedmioty Nexo)
# Liczą się tylko "czyste" przedmioty (bez własnej nazwy/lore/enchantów) z głównego ekwipunku gracza.
# Błędny wpis w koszcie blokuje ulepszenie na ten poziom (komunikat w konsoli).
# wyglad: narzedzie (przedmiot w ręce, wpływa też na drop), kolor-zbroi (#RRGGBB), glowa-tekstura (base64, puste = zwykła głowa).
typy:
  gornik:
    wlaczony: true
    nazwa: 'Górnik'
    # Górnik pracuje na warstwie pod sobą: stawia blok w pustych miejscach, a gdy ich brak - wykopuje go.
    blok: COBBLESTONE
    item:
      material: PLAYER_HEAD
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <zapelnienie>, <pojemnosc>, <interwal>, <zasieg>, <mnoznik>
      nazwa: '<gold>Minion: <typ> <gray>[Poz. <poziom>]'
      lore:
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - ''
        - '<yellow>Kliknij prawym na blok wyspy, aby postawić.'
    poziomy:
      1:
        interwal-sekundy: 15
        pojemnosc: 9
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: WOODEN_PICKAXE
          kolor-zbroi: '#7F7F7F'
      2:
        interwal-sekundy: 13
        pojemnosc: 18
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: STONE_PICKAXE
          kolor-zbroi: '#9E9E9E'
        koszt:
          pieniadze: 5000
          przedmioty:
            - 'COBBLESTONE:256'
      3:
        interwal-sekundy: 11
        pojemnosc: 27
        zasieg: 3
        mnoznik-dropu: 1.25
        wyglad:
          narzedzie: IRON_PICKAXE
          kolor-zbroi: '#D8D8D8'
        koszt:
          pieniadze: 15000
          przedmioty:
            - 'IRON_INGOT:32'
      4:
        interwal-sekundy: 9
        pojemnosc: 36
        zasieg: 3
        mnoznik-dropu: 1.5
        wyglad:
          narzedzie: GOLDEN_PICKAXE
          kolor-zbroi: '#FFD700'
        koszt:
          pieniadze: 40000
          przedmioty:
            - 'GOLD_INGOT:32'
      5:
        interwal-sekundy: 7
        pojemnosc: 45
        zasieg: 4
        mnoznik-dropu: 2.0
        wyglad:
          narzedzie: DIAMOND_PICKAXE
