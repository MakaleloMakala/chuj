gui:
  # Dostępne zmienne: <typ>, <poziom>, <strona>, <strony>
  tytul: '<dark_gray>Minion: <typ> <gray>(<strona>/<strony>) <rzadkosc>'
  wypelnienie:
    material: GRAY_STAINED_GLASS_PANE
    nazwa: ' '
  # Linie dopisywane do lore przedmiotów w magazynie.
  lore-przedmiotu:
    - ''
    - '<yellow>Kliknij, aby odebrać.'
  # Sloty przycisków w ostatnim rzędzie (45-53).
  przyciski:
    poprzednia-strona:
      slot: 45
      material: ARROW
      nazwa: '<yellow>Poprzednia strona'
      lore: []
    odbierz-wszystko:
      slot: 48
      material: HOPPER
      nazwa: '<green>Odbierz wszystko'
      lore:
        - '<gray>Przenosi przedmioty z magazynu'
        - '<gray>do Twojego ekwipunku.'
    informacje:
      slot: 49
      material: BOOK
      nazwa: '<gold>Informacje'
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <wlasciciel>, <zapelnienie>, <pojemnosc>,
      # <status>, <interwal>, <zasieg>, <mnoznik>, <bonus>, <moduly>, <sloty-modulow>, <paliwo>
      lore:
        - '<gray>Typ: <white><typ>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Właściciel: <white><wlasciciel>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - '<gray>Cykl pracy: <white>co <interwal> s'
        - '<gray>Zasięg: <white><zasieg>'
        - '<gray>Mnożnik dropu: <white>x<mnoznik>'
        - '<gray>Bonusowy drop: <white><bonus>%'
        - '<gray>Moduły: <white><moduly>/<sloty-modulow>'
        - '<gray>Paliwo: <white><paliwo>'
        - '<gray>Status: <status>'
    zbierz-miniona:
      slot: 50
      material: BARRIER
      nazwa: '<red>Zbierz miniona'
      lore:
        - '<gray>Zabiera miniona do ekwipunku.'
        - '<gray>Dostępne tylko dla właściciela.'
    ulepsz:
      slot: 46
      material: EXPERIENCE_BOTTLE
      # Dostępne zmienne: jak w "informacje" oraz <nastepny-poziom>, <nowy-interwal>, <nowa-pojemnosc>,
      # <nowy-zasieg>, <nowy-mnoznik>, <nowy-max-poziom>. Linia zawierająca tylko '<koszt>' zostanie zastąpiona listą kosztów.
      nazwa: '<green>Ulepsz do poziomu <nastepny-poziom>'
      lore:
        - '<gray>Cykl pracy: <white><interwal> s</white> → <green><nowy-interwal> s'
        - '<gray>Pojemność: <white><pojemnosc></white> → <green><nowa-pojemnosc>'
        - '<gray>Zasięg: <white><zasieg></white> → <green><nowy-zasieg>'
        - '<gray>Mnożnik dropu: <white>x<mnoznik></white> → <green>x<nowy-mnoznik>'
        - ''
        - '<gray>Koszt:'
        - '<koszt>'
        - ''
        - '<yellow>Kliknij, aby ulepszyć.'
      koszt-pieniadze: '<gray> - <gold><kwota>'
      koszt-przedmiot: '<gray> - <white><ilosc>x </white><nazwa>'
      koszt-darmowy: '<gray> - <green>Darmowe'
    ulepsz-max:
      material: NETHER_STAR
      nazwa: '<gold>Maksymalny poziom'
      lore:
        - '<gray>Ten minion osiągnął maksymalny poziom.'
    moduly:
      slot: 47
      material: COMPARATOR
      nazwa: '<aqua>Moduły'
      lore:
        - '<gray>Zainstalowane: <white><moduly>/<sloty-modulow>'
        - ''
        - '<yellow>Kliknij, aby otworzyć.'
    # Widoczny tylko, gdy ulepszanie-rzadkosci.wlaczone: true.
    # Zmienne: jak w "ulepsz" oraz <nastepna-rzadkosc>, <nowe-sloty-modulow>.
    rzadkosc:
      slot: 51
      material: AMETHYST_SHARD
      nazwa: '<light_purple>Ulepsz rzadkość: <nastepna-rzadkosc>'
      lore:
        - '<gray>Cykl pracy: <white><interwal> s</white> → <green><nowy-interwal> s'
        - '<gray>Pojemność: <white><pojemnosc></white> → <green><nowa-pojemnosc>'
        - '<gray>Mnożnik dropu: <white>x<mnoznik></white> → <green>x<nowy-mnoznik>'
        - '<gray>Sloty modułów: <white><sloty-modulow></white> → <green><nowe-sloty-modulow>'
        - ''
        - '<gray>Koszt:'
        - '<koszt>'
        - ''
        - '<yellow>Kliknij, aby ulepszyć.'
    rzadkosc-max:
      material: DRAGON_BREATH
      nazwa: '<light_purple>Najwyższa rzadkość'
      lore:
        - '<gray>Ten minion ma najwyższą rzadkość.'
    zamknij:
      slot: 52
      material: OAK_DOOR
      nazwa: '<gray>Zamknij'
      lore: []
    nastepna-strona:
      slot: 53
      material: ARROW
      nazwa: '<yellow>Następna strona'
      lore: []

# GUI modułów (4 rzędy): rząd 1 - sloty modułów miniona, rząd 3 - moduły do zainstalowania, rząd 4 - przyciski (27-35).
