        - '<yellow>Shift + klik: dolej cały stos'
    lacze-skrzyni:
      slot: 32
      material: CHEST
      nazwa: '<gold>Ustaw skrzynię'
      lore:
        - '<gray>Połączona skrzynia: <white><skrzynia>'
