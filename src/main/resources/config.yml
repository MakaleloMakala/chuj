gui:
  # Dostępne zmienne: <typ>, <poziom>, <strona>, <strony>
  tytul: '<dark_gray>Minion: <typ> <gray>(<strona>/<strony>)'
  wypelnienie:
    material: GRAY_STAINED_GLASS_PANE
    nazwa: ' '
  # Linie dopisywane do lore przedmiotów w magazynie.
  lore-przedmiotu:
    - ''
    - '<yellow>Kliknij, aby odebrać.'
  # Sloty przycisków w ostatnim rzędzie (45-53).
  przyciski:
    poprzednia-strona:
      slot: 45
      material: ARROW
      nazwa: '<yellow>Poprzednia strona'
      lore: []
    odbierz-wszystko:
      slot: 48
      material: HOPPER
      nazwa: '<green>Odbierz wszystko'
      lore:
        - '<gray>Przenosi przedmioty z magazynu'
        - '<gray>do Twojego ekwipunku.'
    informacje:
      slot: 49
      material: BOOK
      nazwa: '<gold>Informacje'
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <wlasciciel>, <zapelnienie>, <pojemnosc>,
      # <status>, <interwal>, <zasieg>, <mnoznik>
      lore:
        - '<gray>Typ: <white><typ>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Właściciel: <white><wlasciciel>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - '<gray>Cykl pracy: <white>co <interwal> s'
        - '<gray>Zasięg: <white><zasieg>'
        - '<gray>Mnożnik dropu: <white>x<mnoznik>'
        - '<gray>Status: <status>'
    zbierz-miniona:
      slot: 50
      material: BARRIER
      nazwa: '<red>Zbierz miniona'
      lore:
        - '<gray>Zabiera miniona do ekwipunku.'
        - '<gray>Dostępne tylko dla właściciela.'
    ulepsz:
      slot: 46
      material: EXPERIENCE_BOTTLE
      # Dostępne zmienne: jak w "informacje" oraz <nastepny-poziom>, <nowy-interwal>, <nowa-pojemnosc>,
      # <nowy-zasieg>, <nowy-mnoznik>. Linia zawierająca tylko '<koszt>' zostanie zastąpiona listą kosztów.
