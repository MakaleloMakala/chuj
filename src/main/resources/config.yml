# ==========================================================
#  Miniony - konfiguracja
#  Wszystkie teksty używają formatu MiniMessage:
#  https://docs.advntr.dev/minimessage/format.html
# ==========================================================

# Wersja pliku konfiguracyjnego - nie zmieniaj ręcznie.
wersja-configu: 4

baza-danych:
  # Nazwa pliku bazy SQLite w folderze pluginu.
  plik: 'miniony.db'
  # Co ile sekund zapisywać zmienione miniony (praca, zmiana magazynu przez pracę).
  # Akcje graczy (stawianie, zbieranie, odbieranie itemów) zapisywane są natychmiast.
  autozapis-sekundy: 30

praca:
  # Co ile ticków (20 ticków = 1 sekunda) scheduler sprawdza, które miniony mają wykonać cykl pracy.
  # Każdy minion pracuje według własnego interwału z sekcji "typy".
  takt-tickow: 20
  # Maksymalny czas (ms) pracy minionów w jednym takcie. Gdy zostanie przekroczony, pozostałe miniony
  # wykonają pracę w kolejnym takcie (ochrona przed lagami przy setkach minionów).
  maks-ms-na-takt: 10

wyspy:
  # Gdy SuperiorSkyblock2 jest zainstalowany: miniona można postawić tylko na wyspie,
  # której gracz jest członkiem. Gdy SSB2 nie ma na serwerze, to ustawienie jest ignorowane.
  wymagaj-wyspy: true
  # Czy członkowie wyspy (nie tylko właściciel miniona) mogą otwierać GUI i odbierać itemy.
  dostep-czlonkow: true
  # Czy zmiany bloków wykonywane przez miniony mają być zgłaszane do SSB2 (liczniki bloków / wartość wyspy).
  aktualizuj-bloki-wyspy: true

limity:
  # Domyślny limit postawionych minionów na gracza (gdy nie ma permisji miniony.limit.<liczba>).
  domyslny: 3
  # Twardy sufit - żadna permisja miniony.limit.<liczba> nie da więcej niż ta wartość.
  maksimum: 50
  # Czy permisja miniony.limit.bypass ignoruje także twardy sufit.
  bypass-ignoruje-maksimum: true

ulepszanie:
  # true = ulepszać może tylko właściciel miniona (i administrator), false = każdy z dostępem do GUI.
  tylko-wlasciciel: true

zbieranie:
  # Przy zbieraniu miniona przenieś zawartość jego magazynu do ekwipunku gracza.
  # To, co się nie zmieści, zostaje w magazynie miniona (zapisane razem z nim) - nic nie wypada na ziemię.
  oddaj-magazyn: true

hologram:
  wlaczony: true
  # Wysokość hologramu nad podstawą miniona (w blokach).
  wysokosc: 1.35
  # Z jakiej odległości (w blokach) widać hologram. Mniejsza wartość = mniej pracy dla klientów przy wielu minionach.
  zasieg-widocznosci: 24
  # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <wlasciciel>, <zapelnienie>, <pojemnosc>, <status>,
  # <interwal>, <zasieg>, <mnoznik>, <bonus>, <moduly>, <sloty-modulow>
  linie:
    - '<rzadkosc> <gold><typ> <gray>[<white>Poz. <poziom></white>]'
    - '<gray>Właściciel: <white><wlasciciel>'
    - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc></white>'
    - '<status>'
  status:
    pracuje: '<green>Pracuje'
    pelny: '<red>Magazyn pełny'
    brak-miejsca: '<yellow>Brak miejsca do pracy'
    oczekuje: '<gray>Oczekuje'
    brak-celu: '<yellow>Brak celu pracy'

# Rzadkości minionów - kolejność w pliku = kolejność ulepszania (pierwsza to najniższa).
# ZWYKLY musi istnieć (domyślna rzadkość). Można dodawać własne rzadkości.
#   mnoznik-szybkosci        - dzieli interwał pracy (1.5 = 1,5x szybciej)
#   mnoznik-dropu            - mnoży drop (razem z mnożnikiem poziomu)
#   mnoznik-pojemnosci       - mnoży pojemność magazynu z poziomu (maks. 270 slotów)
#   max-poziom               - najwyższy poziom dostępny dla tej rzadkości (0 = bez ograniczenia)
#   sloty-modulow            - ile modułów można zainstalować (0-9)
#   szansa-bonusowego-dropu  - szansa (0.0-1.0) na podwójny drop w cyklu pracy
#   limit                    - ile minionów tej rzadkości może postawić jeden gracz (-1 = bez limitu);
#                              permisja miniony.limit.<rzadkość>.<liczba> nadpisuje tę wartość (bierzemy największą)
#   koszt-ulepszenia         - koszt ulepszenia NA tę rzadkość z poprzedniej (format jak koszt poziomu)
rzadkosci:
  ZWYKLY:
    nazwa: '<gray>Zwykły'
    mnoznik-szybkosci: 1.0
    mnoznik-dropu: 1.0
    mnoznik-pojemnosci: 1.0
    max-poziom: 0
    sloty-modulow: 1
    szansa-bonusowego-dropu: 0.0
    limit: -1
  RZADKI:
    nazwa: '<blue>Rzadki'
    mnoznik-szybkosci: 1.1
    mnoznik-dropu: 1.1
    mnoznik-pojemnosci: 1.25
    max-poziom: 0
    sloty-modulow: 2
    szansa-bonusowego-dropu: 0.02
    limit: -1
    koszt-ulepszenia:
      pieniadze: 50000
      przedmioty:
        - 'DIAMOND:32'
  EPICKI:
    nazwa: '<dark_purple>Epicki'
    mnoznik-szybkosci: 1.25
    mnoznik-dropu: 1.25
    mnoznik-pojemnosci: 1.5
    max-poziom: 0
    sloty-modulow: 3
    szansa-bonusowego-dropu: 0.05
    limit: 10
    koszt-ulepszenia:
      pieniadze: 150000
      przedmioty:
        - 'EMERALD:64'
  LEGENDARNY:
    nazwa: '<gold>Legendarny'
    mnoznik-szybkosci: 1.5
    mnoznik-dropu: 1.5
    mnoznik-pojemnosci: 2.0
    max-poziom: 0
    sloty-modulow: 4
    szansa-bonusowego-dropu: 0.1
    limit: 3
    koszt-ulepszenia:
      pieniadze: 500000
      przedmioty:
        - 'NETHER_STAR:1'

ulepszanie-rzadkosci:
  # Czy gracze mogą ulepszać rzadkość w GUI (przycisk w slocie gui.przyciski.rzadkosc).
  wlaczone: false
  # Czy do ulepszenia rzadkości minion musi mieć maksymalny poziom (dla obecnej rzadkości).
  wymaga-max-poziomu: true

# Praca offline: gdy chunk miniona był wyładowany, przy ponownym załadowaniu (np. wejście na wyspę)
# minion dostaje produkcję za ten czas (wg sekcji "offline" typu, z mnożnikami, rzadkością i modułami).
# To, co nie zmieści się w magazynie, przepada (albo jest sprzedawane, jeśli działa moduł auto-sprzedaży).
praca-offline:
  wlaczona: true
  # Maksymalny naliczany czas w godzinach (0 = brak produkcji offline).
  maks-godzin: 12
  # Czy liczyć też czas, gdy serwer był wyłączony.
  licz-czas-wylaczenia-serwera: false

# Moduły instalowane w GUI miniona (przycisk "Moduły"). Liczba slotów zależy od rzadkości.
# Wspólne opcje: wlaczony, nazwa, ikona, opis (lore), koszt (jak koszt poziomu), dozwolone-typy (puste = wszystkie).
# Odinstalowanie modułu (shift + klik) nie zwraca kosztu.
moduly:
  auto-przetapianie:
    wlaczony: true
    nazwa: '<gold>Auto-przetapianie'
    ikona: FURNACE
    opis:
      - '<gray>Przetapia drop jak piec'
      - '<gray>(np. surowe żelazo -> sztabka).'
    koszt:
      pieniadze: 25000
      przedmioty:
        - 'FURNACE:8'
    dozwolone-typy: []
    # Materiały, których moduł nie przetapia.
    pomijaj:
      - COBBLESTONE
      - OAK_LOG
  auto-sprzedaz:
    wlaczony: true
    nazwa: '<green>Auto-sprzedaż'
    ikona: GOLD_INGOT
    opis:
      - '<gray>Sprzedaje drop z cennika (Vault),'
      - '<gray>pieniądze trafiają do właściciela.'
    koszt:
      pieniadze: 50000
      przedmioty: []
    dozwolone-typy: []
    # Co ile sekund następuje sprzedaż (oraz zawsze, gdy magazyn jest pełny).
    co-ile-sekund: 60
    # Czy wysyłać właścicielowi (online) wiadomość o sprzedaży.
    powiadomienia: false
    # Ceny za sztukę. Sprzedawane są tylko "czyste" przedmioty z tej listy.
    ceny:
      COBBLESTONE: 0.5
      OAK_LOG: 1.0
      WHEAT: 1.0
      COD: 2.0
      SALMON: 3.0
      ROTTEN_FLESH: 0.5
      BONE: 1.0
      IRON_INGOT: 10.0
  kompaktor:
    wlaczony: true
    nazwa: '<aqua>Kompaktor'
    ikona: PISTON
    opis:
      - '<gray>Zamienia przedmioty w magazynie'
      - '<gray>na bloki (np. 9 sztabek -> blok).'
    koszt:
      pieniadze: 30000
      przedmioty:
        - 'PISTON:16'
    dozwolone-typy: []
    # Format: WEJŚCIE:ilość:WYJŚCIE
    przepisy:
      - 'IRON_INGOT:9:IRON_BLOCK'
      - 'GOLD_INGOT:9:GOLD_BLOCK'
      - 'DIAMOND:9:DIAMOND_BLOCK'
      - 'EMERALD:9:EMERALD_BLOCK'
      - 'REDSTONE:9:REDSTONE_BLOCK'
      - 'LAPIS_LAZULI:9:LAPIS_BLOCK'
      - 'COAL:9:COAL_BLOCK'
      - 'WHEAT:9:HAY_BLOCK'
      - 'SLIME_BALL:9:SLIME_BLOCK'
      - 'BONE_MEAL:9:BONE_BLOCK'
  paliwo:
    wlaczony: true
    nazwa: '<red>Komora paliwa'
    ikona: BLAST_FURNACE
    opis:
      - '<gray>Pozwala dolewać paliwo,'
      - '<gray>które przyspiesza pracę miniona.'
    koszt:
      pieniadze: 20000
      przedmioty: []
    dozwolone-typy: []
    # Maksymalny zapas paliwa w godzinach.
    maks-godzin: 24
    # Paliwa: czas działania jednej sztuki i mnożnik szybkości. Nie można mieszać rodzajów paliwa.
    paliwa:
      COAL:
        czas-sekundy: 1800
        mnoznik-szybkosci: 1.1
      COAL_BLOCK:
        czas-sekundy: 16200
        mnoznik-szybkosci: 1.1
      BLAZE_ROD:
        czas-sekundy: 3600
        mnoznik-szybkosci: 1.25
      LAVA_BUCKET:
        czas-sekundy: 7200
        mnoznik-szybkosci: 1.25
  rozszerzenie-zasiegu:
    wlaczony: true
    nazwa: '<yellow>Rozszerzenie zasięgu'
    ikona: SPYGLASS
    opis:
      - '<gray>Zwiększa zasięg pracy miniona.'
    koszt:
      pieniadze: 40000
      przedmioty:
        - 'ENDER_PEARL:16'
    dozwolone-typy: []
    # O ile bloków zwiększa zasięg.
    bonus: 1
  lacze-skrzyni:
    wlaczony: true
    nazwa: '<gold>Łącze ze skrzynią'
    ikona: CHEST
    opis:
      - '<gray>Przenosi zawartość magazynu'
      - '<gray>do wskazanej skrzyni.'
    koszt:
      pieniadze: 15000
      przedmioty:
        - 'HOPPER:4'
    dozwolone-typy: []
    # Maksymalna odległość skrzyni od miniona (w blokach). Skrzynia musi być na tej samej wyspie.
    maks-odleglosc: 8

# Typy minionów. Klucz sekcji to identyfikator typu używany w komendach (/minion give <gracz> <typ>).
# Każdy typ ma poziomy 1..N (sekcja "poziomy"). Wartości, których nie podasz w danym poziomie,
# są dziedziczone z poprzedniego poziomu. "koszt" to koszt ulepszenia NA dany poziom:
#   pieniadze: kwota pobierana przez Vault (0 = brak)
#   przedmioty: lista 'MATERIAL:ilość' albo 'nexo:id_przedmiotu:ilość' (przedmioty Nexo)
# Liczą się tylko "czyste" przedmioty (bez własnej nazwy/lore/enchantów) z głównego ekwipunku gracza.
# Błędny wpis w koszcie blokuje ulepszenie na ten poziom (komunikat w konsoli).
# wyglad: narzedzie (przedmiot w ręce, wpływa też na drop), kolor-zbroi (#RRGGBB), glowa-tekstura (base64, puste = zwykła głowa).
typy:
  gornik:
    wlaczony: true
    nazwa: 'Górnik'
    # Górnik pracuje na warstwie pod sobą: stawia blok w pustych miejscach, a gdy ich brak - wykopuje go.
    blok: COBBLESTONE
    item:
      material: PLAYER_HEAD
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <zapelnienie>, <pojemnosc>, <interwal>, <zasieg>, <mnoznik>
      nazwa: '<rzadkosc> <gold>Minion: <typ> <gray>[Poz. <poziom>]'
      lore:
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - ''
        - '<yellow>Kliknij prawym na blok wyspy, aby postawić.'
    # Praca offline (gdy chunk był wyładowany): co "cykle-na-drop" cykli pracy powstaje jedna jednostka dropu.
    # Ustaw tak, by odpowiadało pracy online (np. górnik: postawienie + wykopanie = 2 cykle).
    offline:
      wlaczona: true
      cykle-na-drop: 2
      drop:
        - 'COBBLESTONE:1'
    poziomy:
      1:
        interwal-sekundy: 15
        pojemnosc: 9
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: WOODEN_PICKAXE
          kolor-zbroi: '#7F7F7F'
      2:
        interwal-sekundy: 13
        pojemnosc: 18
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: STONE_PICKAXE
          kolor-zbroi: '#9E9E9E'
        koszt:
          pieniadze: 5000
          przedmioty:
            - 'COBBLESTONE:256'
      3:
        interwal-sekundy: 11
        pojemnosc: 27
        zasieg: 3
        mnoznik-dropu: 1.25
        wyglad:
          narzedzie: IRON_PICKAXE
          kolor-zbroi: '#D8D8D8'
        koszt:
          pieniadze: 15000
          przedmioty:
            - 'IRON_INGOT:32'
      4:
        interwal-sekundy: 9
        pojemnosc: 36
        zasieg: 3
        mnoznik-dropu: 1.5
        wyglad:
          narzedzie: GOLDEN_PICKAXE
          kolor-zbroi: '#FFD700'
        koszt:
          pieniadze: 40000
          przedmioty:
            - 'GOLD_INGOT:32'
      5:
        interwal-sekundy: 7
        pojemnosc: 45
        zasieg: 4
        mnoznik-dropu: 2.0
        wyglad:
          narzedzie: DIAMOND_PICKAXE
          kolor-zbroi: '#5DECF5'
        koszt:
          pieniadze: 100000
          przedmioty:
            - 'DIAMOND:16'
            # przykład przedmiotu Nexo: - 'nexo:mithril_ingot:4'

  drwal:
    wlaczony: true
    nazwa: 'Drwal'
    # Drwal pracuje na swoim poziomie: stawia pnie na stałym gruncie i ścina je.
    blok: OAK_LOG
    item:
      material: PLAYER_HEAD
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <zapelnienie>, <pojemnosc>, <interwal>, <zasieg>, <mnoznik>
      nazwa: '<rzadkosc> <gold>Minion: <typ> <gray>[Poz. <poziom>]'
      lore:
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - ''
        - '<yellow>Kliknij prawym na blok wyspy, aby postawić.'
    # Praca offline (gdy chunk był wyładowany): co "cykle-na-drop" cykli pracy powstaje jedna jednostka dropu.
    # Ustaw tak, by odpowiadało pracy online (np. górnik: postawienie + wykopanie = 2 cykle).
    offline:
      wlaczona: true
      cykle-na-drop: 2
      drop:
        - 'OAK_LOG:1'
    poziomy:
      1:
        interwal-sekundy: 15
        pojemnosc: 9
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: WOODEN_AXE
          kolor-zbroi: '#6B4423'
      2:
        interwal-sekundy: 13
        pojemnosc: 18
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: STONE_AXE
          kolor-zbroi: '#7B5433'
        koszt:
          pieniadze: 5000
          przedmioty:
            - 'OAK_LOG:128'
      3:
        interwal-sekundy: 11
        pojemnosc: 27
        zasieg: 3
        mnoznik-dropu: 1.25
        wyglad:
          narzedzie: IRON_AXE
          kolor-zbroi: '#8B6443'
        koszt:
          pieniadze: 15000
          przedmioty:
            - 'IRON_INGOT:32'
      4:
        interwal-sekundy: 9
        pojemnosc: 36
        zasieg: 3
        mnoznik-dropu: 1.5
        wyglad:
          narzedzie: GOLDEN_AXE
          kolor-zbroi: '#A0522D'
        koszt:
          pieniadze: 40000
          przedmioty:
            - 'GOLD_INGOT:32'
      5:
        interwal-sekundy: 7
        pojemnosc: 45
        zasieg: 4
        mnoznik-dropu: 2.0
        wyglad:
          narzedzie: DIAMOND_AXE
          kolor-zbroi: '#C68E5A'
        koszt:
          pieniadze: 100000
          przedmioty:
            - 'DIAMOND:16'

  farmer:
    wlaczony: true
    nazwa: 'Farmer'
    # Farmer pracuje na swoim poziomie: zbiera dojrzałe uprawy i sadzi je ponownie,
    # sadzi na wolnej ziemi uprawnej i przyspiesza wzrost.
    # Obsługiwane uprawy: WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART (na piasku dusz).
    uprawa: WHEAT
    # Czy zamieniać ziemię/trawę pod wolnym miejscem na ziemię uprawną.
    oraj-ziemie: true
    # O ile etapów rośnie niedojrzała uprawa w jednym cyklu (1-10).
    wzrost-na-cykl: 1
    item:
      material: PLAYER_HEAD
      # Dostępne zmienne: <typ>, <poziom>, <max-poziom>, <rzadkosc>, <zapelnienie>, <pojemnosc>, <interwal>, <zasieg>, <mnoznik>
      nazwa: '<rzadkosc> <gold>Minion: <typ> <gray>[Poz. <poziom>]'
      lore:
        - '<gray>Rzadkość: <rzadkosc>'
        - '<gray>Poziom: <white><poziom>/<max-poziom>'
        - '<gray>Magazyn: <white><zapelnienie>/<pojemnosc>'
        - ''
        - '<yellow>Kliknij prawym na blok wyspy, aby postawić.'
    # Praca offline (gdy chunk był wyładowany): co "cykle-na-drop" cykli pracy powstaje jedna jednostka dropu.
    # Ustaw tak, by odpowiadało pracy online (np. górnik: postawienie + wykopanie = 2 cykle).
    offline:
      wlaczona: true
      cykle-na-drop: 9
      drop:
        - 'WHEAT:1'
        - 'WHEAT_SEEDS:1'
    poziomy:
      1:
        interwal-sekundy: 15
        pojemnosc: 9
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: WOODEN_HOE
          kolor-zbroi: '#4CAF50'
      2:
        interwal-sekundy: 13
        pojemnosc: 18
        zasieg: 2
        mnoznik-dropu: 1.0
        wyglad:
          narzedzie: STONE_HOE
          kolor-zbroi: '#43A047'
        koszt:
          pieniadze: 5000
          przedmioty:
            - 'WHEAT:128'
      3:
        interwal-sekundy: 11
        pojemnosc: 27
        zasieg: 3
        mnoznik-dropu: 1.25
        wyglad:
          narzedzie: IRON_HOE
          kolor-zbroi: '#388E3C'
        koszt:
          pieniadze: 15000
          przedmioty:
            - 'IRON_INGOT:32'
      4:
        interwal-sekundy: 9
        pojemnosc: 36
        zasieg: 3
        mnoznik-dropu: 1.5
        wyglad:
          narzedzie: GOLDEN_HOE
          kolor-zbroi: '#2E7D32'
        koszt:
          pieniadze: 40000
          przedmioty:
            - 'GOLD_INGOT:32'
      5:
        interwal-sekundy: 7
        pojemnosc: 45
        zasieg: 4
        mnoznik-dropu: 2.0
        wyglad:
          narzedzie: DIAMOND_HOE
          kolor-zbroi: '#1B5E20'
        koszt:
          pieniadze: 100000
          przedmioty:
            - 'DIAMOND:16'

  rybak:
    wlaczony: true
    nazwa: 'Rybak'
    # Rybak potrzebuje źródeł wody na warstwie pod sobą (w zasięgu). Nie zmienia bloków.
    min-wody: 1
    # Łup: 'MATERIAL:ilość:waga' albo 'MATERIAL:min-max:waga'. Szansa = waga / suma wag.
    lup:
      - 'COD:1:60'
      - 'SALMON:1:25'
      - 'PUFFERFISH:1:13'
