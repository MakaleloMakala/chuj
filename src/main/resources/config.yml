    nazwa: '<dark_gray>Zablokowany slot'
    lore:
      - '<gray>Więcej slotów daje wyższa rzadkość.'
  lore-zainstalowany:
    - ''
    - '<green>Aktywny'
    - '<red>Shift + klik: odinstaluj (bez zwrotu kosztu)'
  lore-nieaktywny:
    - ''
    - '<red>Nieaktywny (wyłączony, niedozwolony lub poza slotami)'
  lore-do-kupienia:
    - ''
    - '<gray>Koszt:'
    - '<koszt>'
    - ''
    - '<yellow>Kliknij, aby zainstalować.'
  lore-juz-zainstalowany:
    - ''
    - '<green>Zainstalowany'
  lore-niedozwolony:
    - ''
    - '<red>Niedostępny dla tego typu miniona'
  przyciski:
    powrot:
      slot: 27
      material: ARROW
      nazwa: '<yellow>Powrót'
      lore: []
    paliwo:
      slot: 30
      material: COAL
      nazwa: '<gold>Dolej paliwa'
      lore:
